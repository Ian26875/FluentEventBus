name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        run: dotnet build src/FluentEventBus.sln -c Release

      - name: Test
        run: dotnet test src/FluentEventBus.sln -c Release --no-build --logger "console;verbosity=normal"

  rabbitmq-integration-tests:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Run RabbitMQ Integration Tests
        env:
          RUN_RABBITMQ_TESTS: "1"
          RABBITMQ_HOST: "localhost"
          RABBITMQ_PORT: "5672"
        run: dotnet test src/FluentEventBus.RabbitMqTests/FluentEventBus.RabbitMqTests.csproj -c Release -f net10.0 --filter "FullyQualifiedName~RabbitMqIntegrationTests" --logger "console;verbosity=normal"
